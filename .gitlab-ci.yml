stages:
  - test

.phpunit:
  stage: test
  before_script:
    - apt-get update -qq && apt-get install -y -qq git unzip > /dev/null
    - curl -sS https://getcomposer.org/installer | php -- --install-dir=/usr/local/bin --filename=composer
    - composer install --no-interaction --no-progress
  script:
    - find src templates carbon-pay-woocommerce.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
    - vendor/bin/phpunit

phpunit:php7.4:
  extends: .phpunit
  image: php:7.4-cli

phpunit:php8.3:
  extends: .phpunit
  image: php:8.3-cli

phpunit:php8.5:
  extends: .phpunit
  image: php:8.5-cli

js:
  stage: test
  image: node:24
  script:
    - npm test
    - for f in assets/js/*.js; do node --check "$f"; done
